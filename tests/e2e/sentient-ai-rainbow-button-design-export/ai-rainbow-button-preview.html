
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentientWeb AI Rainbow Button Preview</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--cream:#f1f6ff;--neon:#6fff00;--font-grotesk:Anton,Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:48px 18px;background:radial-gradient(circle at 18% 12%,rgba(111,255,0,.16),transparent 30rem),radial-gradient(circle at 82% 22%,rgba(85,214,255,.1),transparent 28rem),linear-gradient(180deg,#020a26,#01030d 70%);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.roi-section{position:relative;width:min(1180px,100%);min-height:420px;display:grid;place-items:center;overflow:hidden;border-block:1px solid rgba(255,255,255,.1);border-radius:28px;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.1),rgba(1,3,13,.72) 62%,rgba(1,3,13,.92) 100%),radial-gradient(ellipse at 50% 45%,rgba(255,138,138,.22),transparent 28%),radial-gradient(ellipse at 52% 56%,rgba(111,255,0,.18),transparent 34%),#02030d;box-shadow:0 30px 110px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.08)}.roi-section:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(241,246,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(241,246,255,.04) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 76%)}.preview-copy{position:absolute;left:clamp(20px,4vw,56px);top:clamp(20px,4vw,48px)}.preview-copy p{margin:0;color:var(--neon);font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.preview-copy h1{max-width:520px;margin:14px 0 0;color:var(--cream);font-family:var(--font-grotesk);font-size:clamp(34px,5vw,68px);font-weight:900;line-height:1.02;text-transform:uppercase}.ai-rainbow-cta{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid transparent;border-radius:999px;padding:18px 40px;color:var(--cream);text-align:center;text-decoration:none;background:linear-gradient(#02030d,#02030d) padding-box,conic-gradient(from var(--ai-rainbow-spin,0deg),#ff8a8a,#ffce5c,#6fff00,#55d6ff,#9f7cff,#ff8a8a) border-box;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 64px rgba(111,255,0,.18),0 14px 52px rgba(255,138,138,.16),inset 0 1px rgba(255,255,255,.18);transform:translateZ(0);animation:ai-rainbow-border-spin 4.8s linear infinite}.ai-rainbow-cta:before{content:"";position:absolute;inset:1px;z-index:-2;border-radius:inherit;background:radial-gradient(circle at 18% 22%,rgba(255,138,138,.32),transparent 28%),radial-gradient(circle at 76% 28%,rgba(85,214,255,.28),transparent 30%),radial-gradient(circle at 54% 92%,rgba(111,255,0,.26),transparent 34%),linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));filter:saturate(1.22)}.ai-rainbow-cta:after{content:"";position:absolute;inset:-40% -22%;z-index:-1;background:linear-gradient(105deg,transparent 0%,transparent 35%,rgba(255,255,255,.64) 47%,rgba(111,255,0,.45) 52%,transparent 66%,transparent 100%);opacity:.58;transform:translateX(-58%) rotate(6deg);animation:ai-rainbow-sheen 2.8s cubic-bezier(.72,0,.18,1) infinite}.ai-rainbow-cta__label{position:relative;z-index:2;color:var(--cream);font-family:var(--font-grotesk);font-size:clamp(15px,2vw,18px);line-height:1;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 18px rgba(255,255,255,.32),0 0 30px rgba(111,255,0,.24)}.ai-rainbow-cta:hover .ai-rainbow-cta__label{color:var(--neon);text-shadow:0 0 18px rgba(111,255,0,.72),0 0 38px rgba(85,214,255,.32)}.ai-rainbow-cta__sparkles{pointer-events:none;position:absolute;inset:0;z-index:1;overflow:hidden;border-radius:inherit}.ai-rainbow-cta__sparkles span{position:absolute;left:var(--spark-x);top:var(--spark-y);width:var(--spark-size);height:var(--spark-size);border-radius:999px;background:var(--spark-color);box-shadow:0 0 10px var(--spark-color),0 0 22px rgba(255,255,255,.22);opacity:0;transform:translate3d(0,0,0) scale(.4);animation:ai-rainbow-spark 1.9s ease-in-out infinite;animation-delay:var(--spark-delay)}.ai-rainbow-cta__sparkles span:nth-child(1){--spark-x:12%;--spark-y:26%;--spark-size:4px;--spark-color:#ff8a8a;--spark-delay:-.1s}.ai-rainbow-cta__sparkles span:nth-child(2){--spark-x:28%;--spark-y:70%;--spark-size:3px;--spark-color:#ffce5c;--spark-delay:-.55s}.ai-rainbow-cta__sparkles span:nth-child(3){--spark-x:48%;--spark-y:18%;--spark-size:4px;--spark-color:#6fff00;--spark-delay:-.95s}.ai-rainbow-cta__sparkles span:nth-child(4){--spark-x:66%;--spark-y:74%;--spark-size:3px;--spark-color:#55d6ff;--spark-delay:-1.25s}.ai-rainbow-cta__sparkles span:nth-child(5){--spark-x:80%;--spark-y:30%;--spark-size:4px;--spark-color:#9f7cff;--spark-delay:-1.55s}.ai-rainbow-cta__sparkles span:nth-child(6){--spark-x:92%;--spark-y:62%;--spark-size:3px;--spark-color:#f1f6ff;--spark-delay:-1.8s}@property --ai-rainbow-spin{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes ai-rainbow-border-spin{to{--ai-rainbow-spin:360deg}}@keyframes ai-rainbow-sheen{0%,42%{transform:translateX(-58%) rotate(6deg)}70%,100%{transform:translateX(58%) rotate(6deg)}}@keyframes ai-rainbow-spark{0%,100%{opacity:0;transform:translate3d(0,8px,0) scale(.42)}45%{opacity:.95;transform:translate3d(0,-4px,0) scale(1)}}@media(max-width:640px){.roi-section{min-height:360px}.ai-rainbow-cta{padding:16px 24px;max-width:calc(100vw - 40px)}.ai-rainbow-cta__label{font-size:12px;white-space:normal}}@media(prefers-reduced-motion:reduce){.ai-rainbow-cta,.ai-rainbow-cta:after,.ai-rainbow-cta__sparkles span{animation:none}}
</style>
</head>
<body>
<section class="roi-section" aria-label="ROI calculator button preview">
  <div class="preview-copy">
    <p>CTA treatment</p>
    <h1>AI rainbow magic, still Sentient.</h1>
  </div>
  <a class="ai-rainbow-cta" href="/revenue-leak-calculator">
    <span class="ai-rainbow-cta__sparkles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></span>
    <span class="ai-rainbow-cta__label">Estimate recoverable demos in the last 30 days.</span>
  </a>
</section>
</body>
</html>
