html{color-scheme:dark}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:48px 18px;background:radial-gradient(circle at 50% 20%,rgba(111,255,0,.12),transparent 30rem),linear-gradient(180deg,#020a26,#01030d 70%);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}

.blackhole-profit-suck{pointer-events:none;position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:inherit}
.blackhole-profit-suck span{position:absolute;left:var(--profit-x);top:var(--profit-y);color:rgba(255,138,138,.88);font-family:var(--font-grotesk);font-size:var(--profit-size);line-height:1;text-shadow:0 0 14px rgba(255,138,138,.56),0 0 24px rgba(111,255,0,.16);transform-origin:50% 50%;animation:blackhole-profit-suck .48s cubic-bezier(.74,0,.18,1) infinite;animation-delay:var(--profit-delay)}

.kicker{max-width:30ch;color:rgba(241,246,255,.55);font-size:11px;line-height:1.35;letter-spacing:.14em}

.headline strong{color:var(--cream);font-size:clamp(32px,7vw,42px)}

.label{display:block;margin-top:14px;color:rgba(241,246,255,.62);font-size:15px;line-height:1.6;letter-spacing:.08em}
.rate{max-width:28ch;color:rgba(241,246,255,.58);font-size:12px;line-height:1.7}
.rate span{color:var(--salmon)}
