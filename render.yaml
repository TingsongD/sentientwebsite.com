# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo in the Render Dashboard: New → Blueprint → select repo (render.yaml at root).

previews:
  generation: automatic

services:
  - type: web
    name: sentientweblanding2
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    repo: https://github.com/TingsongD/sentientweblanding2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: VITE_SITE_URL
        value: https://sentientwebsite.com/
      - key: VITE_SENTIENT_WIDGET_ORIGIN
        value: https://app.sentientwebsite.com
      - key: NEXT_PUBLIC_SENTIENT_WIDGET_ORIGIN
        value: https://app.sentientwebsite.com
      - key: VITE_SENTIENT_INSTALL_KEY
        sync: false
      - key: NEXT_PUBLIC_SENTIENT_INSTALL_KEY
        sync: false
      - key: SENTIENT_ALLOWED_HOSTS
        value: sentientwebsite.com,www.sentientwebsite.com,*.onrender.com
      - key: SENTIENT_CONSENT_LOG_PATH
        value: /var/data/sentientweb/consent-events.jsonl
      - key: SENTIENT_CONSENT_LOG_SALT
        sync: false
    disk:
      name: consent-evidence
      mountPath: /var/data
      sizeGB: 5
